<div class="bg-white rounded-xl shadow-lg border border-gray-200 p-6 mb-4 w-full">
  <form method="POST" hx-post="/web/tasks/update" hx-target="#task-list-container" hx-swap="outerHTML">
    <div class="mb-4">
      <label for="tasktype" class="block text-sm font-medium text-gray-700 mb-1">Type</label>
      <select id="tasktype" name="TaskType" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm text-gray-700">
        {{ range .TaskTypes }}
        <option value="{{ . }}" {{ if eq . $.Task.TaskType }}selected{{ end }}>{{ . }}</option>
        {{ end }}
      </select>
    </div>
    <div class="mb-4">
      <label for="taskname" class="block text-sm font-medium text-gray-700 mb-1">Task Name</label>
      <input id="taskname" type="text" name="TaskName" value="{{ .Task.TaskName }}" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-base font-semibold text-gray-900" required />
    </div>
    <div class="mb-4">
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea id="description" name="Description" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm text-gray-700" rows="3">{{ .Task.Description }}</textarea>
    </div>
    <div class="flex gap-2 justify-end">
      <button type="submit" class="inline-block px-4 py-2 bg-primary-600 text-white rounded-lg shadow hover:bg-primary-700 transition-colors text-sm font-medium">Save</button>
      <button type="button" hx-get="/web/tasks/cancel" hx-target="#task-list-container" hx-swap="outerHTML" class="inline-block px-4 py-2 bg-gray-200 text-gray-700 rounded-lg shadow hover:bg-gray-300 transition-colors text-sm font-medium">Cancel</button>
    </div>
  </form>
</div>
