<div id="task-card-{{ .Task.ID }}" class="card bg-base-100 shadow-md border border-base-300 group mb-4 w-full">
  <form 
    method="POST"
    hx-post="/web/fragments/features/{{ .FeatureID }}/tasks/{{ .Task.ID }}/edit"
    hx-target="#task-card-{{ .Task.ID }}"
    hx-swap="outerHTML"
    class="card-body p-6 flex-row items-center justify-between w-full"
  >
    <div class="flex items-center gap-4 w-full">
      <select name="TaskType" class="badge badge-primary font-semibold text-base">
        {{ range .TaskTypes }}
        <option value="{{ . }}" {{ if eq . $.Task.TaskType }}selected{{ end }}>{{ . }}</option>
        {{ end }}
      </select>
      <div class="flex-1">
        <input 
          type="text"
          name="TaskName"
          value="{{ .Task.TaskName }}"
          placeholder="Task name"
          class="font-bold text-base-content text-lg w-full border-none focus:ring-0 focus:outline-none"
          required
        />
        <textarea
          name="Description"
          placeholder="Describe the task..."
          class="text-base-content/70 mt-1 w-full border-none focus:ring-0 focus:outline-none"
          rows="2"
        >{{ .Task.Description }}</textarea>
      </div>
      <div class="card-actions flex-shrink-0 ml-2 flex gap-2">
        <button type="submit" class="btn btn-primary btn-sm">Save</button>
        <button type="button" 
          hx-get="/web/fragments/features/{{ .FeatureID }}/tasks/{{ .Task.ID }}/view"
          hx-target="#task-card-{{ .Task.ID }}"
          hx-swap="outerHTML"
          class="btn btn-ghost btn-sm"
        >Cancel</button>
      </div>
    </div>
  </form>
</div>
