<div id="create-project-success" hx-swap-oob="true" hx-trigger="load delay:500ms" hx-get="/web/projects" hx-target="body">
    <div class="fixed inset-0 z-50 overflow-y-auto">
      <div class="flex items-center justify-center min-h-screen">
        <div class="bg-white rounded-lg p-6 shadow-xl max-w-md mx-auto">
          <div class="flex items-center text-green-500 mb-4">
            <svg class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <h3 class="text-lg font-medium">Project Created Successfully</h3>
          </div>
          <p class="text-gray-600 mb-4">
            Your project "{{ .project.Name }}" has been created. The page will refresh automatically.
          </p>
          <div class="flex justify-end">
            <button onclick="document.getElementById('create-project-success').remove()"
                    class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-medium">
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
