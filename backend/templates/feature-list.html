<div id="main-content" class="bg-white min-h-screen p-8">
<div id="feature-list-container" class="max-w-6xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-4">
      <h2 class="text-3xl font-bold text-gray-900">Features</h2>
      <div class="flex gap-2">
        <a hx-get="/web/projects/{{ .ProjectID }}/features/content?category=All" hx-target="#main-content" hx-swap="innerHTML" hx-select="#main-content" class="px-4 py-2 rounded-lg text-sm font-medium transition {{ if or (not .FilterCategory) (eq .FilterCategory "All") }}bg-blue-600 text-white{{ else }}bg-white text-gray-700 border border-gray-300 hover:bg-gray-50{{ end }}">All</a>
        {{ range .FeatureCategories }}
        <a hx-get="/web/projects/{{ $.ProjectID }}/features/content?category={{ . | urlquery }}" hx-target="#main-content" hx-swap="innerHTML" hx-select="#main-content" class="px-4 py-2 rounded-lg text-sm font-medium transition {{ if eq $.FilterCategory . }}bg-blue-600 text-white{{ else }}bg-white text-gray-700 border border-gray-300 hover:bg-gray-50{{ end }}">{{ . }}</a>
        {{ end }}
      </div>
    </div>
    <div class="flex gap-2">
      <!-- STAGE 4b: AI Suggestions Button -->
      <button 
        hx-post="/web/projects/{{ .ProjectID }}/suggest" 
        hx-target="#suggestions-container" 
        hx-swap="innerHTML"
        hx-indicator="#suggestions-loading"
        class="inline-flex items-center gap-2 px-5 py-2 rounded-lg bg-purple-600 text-white font-medium text-sm shadow hover:bg-purple-700 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
        </svg>
        <span>Get Suggestions</span>
        <span id="suggestions-loading" class="htmx-indicator">
          <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </span>
      </button>
      <button hx-get="/web/projects/{{ .ProjectID }}/features/new" hx-target="#new-feature-form-container" hx-swap="innerHTML" class="inline-flex items-center gap-2 px-5 py-2 rounded-lg bg-blue-600 text-white font-medium text-sm shadow hover:bg-blue-700 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        Add Feature
      </button>
    </div>
  </div>
  
  <!-- STAGE 4b: Suggestions Container -->
  <div id="suggestions-container" class="mt-4"></div>
  <div id="new-feature-form-container"></div>
  <div id="feature-cards-container" class="flex flex-col gap-6 mt-4">
    {{ if .TagFilter }}
      <div class="mb-4 text-lg text-blue-700 font-semibold">Filtering by tag: <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded">{{ .TagFilter }}</span></div>
    {{ end }}
    {{ if not .Features }}
      <div class="text-center text-gray-400 text-lg py-12">No features found{{ if .TagFilter }} with tag <span class="font-semibold">{{ .TagFilter }}</span>{{ end }}.</div>
    {{ else }}
      {{ template "feature-list-inner.html" . }}
    {{ end }}
  </div>
</div>
</div>
