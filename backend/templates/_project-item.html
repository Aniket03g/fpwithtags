{{define "project-item"}}
<div class="px-6 py-4 hover:bg-gray-50">
    <div class="flex items-center justify-between">
        <div class="flex-1">
            <h3 class="text-lg font-medium text-gray-900">
                <a href="/web/projects/{{.ID}}" class="hover:text-blue-600">{{.Name}}</a>
            </h3>
            {{if .Description}}
                <p class="mt-1 text-sm text-gray-500">{{.Description}}</p>
            {{end}}
            <div class="mt-2 flex items-center text-xs text-gray-400">
                <span>Created {{.CreatedAt.Format "Jan 2, 2006"}}</span>
                {{if .UpdatedAt}}
                    <span class="mx-2">•</span>
                    <span>Updated {{.UpdatedAt.Format "Jan 2, 2006"}}</span>
                {{end}}
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <a href="/web/projects/{{.ID}}" 
               class="text-blue-600 hover:text-blue-800 text-sm font-medium">
                View
            </a>
            <button 
                hx-get="/web/projects/{{.ID}}/edit"
                hx-target="#project-form-container"
                hx-swap="innerHTML"
                class="text-gray-600 hover:text-gray-800 text-sm font-medium">
                Edit
            </button>
            <button 
                hx-delete="/api/projects/{{.ID}}"
                hx-target="closest div"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete this project?"
                class="text-red-600 hover:text-red-800 text-sm font-medium">
                Delete
            </button>
        </div>
    </div>
</div>
{{end}}
