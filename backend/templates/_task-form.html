{{define "task-form"}}
<div class="task-item bg-blue-50 rounded-lg p-3 border border-blue-200">
    <form 
        hx-post="/api/tasks"
        hx-target="closest .task-item"
        hx-swap="outerHTML"
        class="space-y-3">
        
        <input type="hidden" name="feature_id" value="{{.FeatureID}}">
        
        <div>
            <label for="title" class="block text-xs font-medium text-gray-700">Task Title</label>
            <input 
                type="text" 
                id="title" 
                name="title" 
                required
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm"
                placeholder="Enter task title">
        </div>
        
        <div>
            <label for="description" class="block text-xs font-medium text-gray-700">Description</label>
            <textarea 
                id="description" 
                name="description" 
                rows="2"
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm"
                placeholder="Enter task description"></textarea>
        </div>
        
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label for="status" class="block text-xs font-medium text-gray-700">Status</label>
                <select 
                    id="status" 
                    name="status"
                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm">
                    <option value="todo">Todo</option>
                    <option value="in_progress">In Progress</option>
                    <option value="done">Done</option>
                </select>
            </div>
            
            <div>
                <label for="priority" class="block text-xs font-medium text-gray-700">Priority</label>
                <select 
                    id="priority" 
                    name="priority"
                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
        </div>
        
        <div>
            <label for="assignee_id" class="block text-xs font-medium text-gray-700">Assignee (Optional)</label>
            <input 
                type="number" 
                id="assignee_id" 
                name="assignee_id"
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-sm"
                placeholder="User ID">
        </div>
        
        <div class="flex justify-end space-x-2">
            <button 
                type="button"
                hx-get="/web/features/{{.FeatureID}}/tasks/new"
                hx-target="closest .task-item"
                hx-swap="outerHTML"
                class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-3 py-1 rounded text-xs font-medium">
                Cancel
            </button>
            <button 
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs font-medium">
                Create Task
            </button>
        </div>
    </form>
</div>
{{end}}
