<div class="p-6">
  <!-- Header with flexbox to align title and button -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold text-gray-800">Projects</h2>
    <button
      hx-get="/web/projects/create-modal"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition-colors text-sm font-medium font-bold flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Create Project
    </button>
  </div>
  
  <div id="project-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-4">
    {{ range .Projects }}
    <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-6 flex flex-col justify-between transition-transform hover:-translate-y-1 hover:shadow-xl">
      <div>
        <h2 class="text-xl font-semibold text-gray-900 mb-2">
          {{ .Name }}
          {{ if .Config.tech_stack }}
            <span class="ml-2 text-sm font-normal text-blue-600 bg-blue-50 px-2 py-1 rounded">[{{ .Config.tech_stack }}]</span>
          {{ end }}
        </h2>
        <p class="text-gray-500 text-sm mb-4">{{ .Description }}</p>
      </div>
      <div class="flex justify-between items-center">
        <button 
          class="text-red-500 hover:text-red-700 transition-colors" 
          hx-delete="/api/projects/{{ .ID }}" 
          hx-confirm="Are you sure you want to delete this project? This action cannot be undone." 
          hx-target="#project-list-container" 
          hx-swap="outerHTML">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
        <a href="/web/projects/{{ .ID }}/features" class="inline-block px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition-colors text-sm font-medium">View</a>
      </div>
    </div>
    {{ end }}
  </div>
  
  <!-- Modal container for the create project form -->
  <div id="modal-container"></div>
</div>
