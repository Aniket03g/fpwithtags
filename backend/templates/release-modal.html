<!-- Release Modal Template - For creating a new release with selected PRs -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60">
  <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl p-8 w-full max-w-lg border border-gray-200 dark:border-gray-800">
    <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">
      Create New Release
    </h2>
    
        <!-- No custom JavaScript needed, we'll use HTMX -->
    <form 
      id="release-form"
      class="space-y-5"
      hx-post="/api/releases"
      hx-target="#modal-container"
      hx-swap="outerHTML"
      hx-on::after-request="if(event.detail.successful) { htmx.ajax('GET', window.location.pathname, {target: '#main-content', swap: 'innerHTML'}); }"
    >
      <!-- Project Selection (Required for release-first workflow) -->
<!-- Project Selection (Required only when no PRs are linked) -->
{{ if not .PRIDs }}
<div>
  <label for="project" class="block mb-1 font-semibold text-gray-700 dark:text-gray-200">Project</label>
  <select 
    id="project" 
    name="project_id" 
    class="w-full rounded-lg border border-gray-300 dark:border-gray-700 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-800 dark:text-white transition"
    required
  >
    <option value="">Select a project...</option>
    {{ if .Projects }}
      {{ range .Projects }}
        <option value="{{ .ID }}" {{ if eq .ID $.SelectedProjectID }}selected{{ end }}>{{ .Name }}</option>
      {{ end }}
    {{ end }}
  </select>
  <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
    Required only when creating a release without PRs
  </p>
</div>
{{ end }}

      
      <div>
        <label class="block mb-1 font-semibold text-gray-700 dark:text-gray-200">Version</label>
        <input 
          name="version" 
          type="text" 
          class="w-full rounded-lg border border-gray-300 dark:border-gray-700 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-800 dark:text-white transition" 
          required
          placeholder="e.g. v1.0.0"
        >
      </div>
      
      <div>
        <label class="block mb-1 font-semibold text-gray-700 dark:text-gray-200">Release Objective</label>
        <textarea 
          name="notes" 
          rows="5" 
          class="w-full rounded-lg border border-gray-300 dark:border-gray-700 px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-800 dark:text-white transition"
          placeholder="Describe the objective and goals of this release..."
        ></textarea>
      </div>
      
      <!-- Hidden field for PR IDs -->
      {{ range $index, $prID := .PRIDs }}
        <input type="hidden" name="prs[]" value="{{ $prID }}">
      {{ end }}
      
      <div class="flex justify-end gap-3 pt-2">
        <button 
          type="button" 
          class="px-5 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-semibold hover:bg-gray-300 dark:hover:bg-gray-600 transition"
          hx-get="/about:blank"
          hx-target="#modal-container"
          hx-swap="outerHTML"
        >Cancel</button>
        
        <button 
          type="submit" 
          class="px-5 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 focus:ring-2 focus:ring-blue-400 transition"
        >Create Release</button>
      </div>
    </form>
  </div>
</div>
