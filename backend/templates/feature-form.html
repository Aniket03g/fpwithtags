<div class="bg-white rounded-xl shadow-lg border border-gray-200 p-6 mb-4 w-full">
  <form 
    hx-post="/web/projects/{{ .ProjectID }}/features"
    hx-target="#feature-cards-container"
    hx-swap="innerHTML"
    class="space-y-4"
  >
    <div class="mb-4">
      <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
      <input id="title" name="title" type="text" value="{{ .Feature.Title }}" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-base font-semibold text-gray-900" required />
    </div>
    <div class="mb-4">
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea id="description" name="description" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm text-gray-700" rows="3">{{ .Feature.Description }}</textarea>
    </div>
    <div class="mb-4">
      <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
      <select id="category" name="category" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm text-gray-700">
        <option value="" disabled selected>Select Category</option>
        {{ range .FeatureCategories }}
        <option value="{{ . }}" {{ if eq $.Feature.Category . }}selected{{ end }}>{{ . }}</option>
        {{ end }}
      </select>
    </div>
    <div class="flex gap-2 justify-end">
      <button type="submit" class="inline-block px-4 py-2 bg-primary-600 text-white rounded-lg shadow hover:bg-primary-700 transition-colors text-sm font-medium">Save</button>
      <button type="button" hx-get="/web/features/cancel" hx-target="#new-feature-form-container" hx-swap="innerHTML" class="inline-block px-4 py-2 bg-gray-200 text-gray-700 rounded-lg shadow hover:bg-gray-300 transition-colors text-sm font-medium">Cancel</button>
    </div>
  </form>
</div>
