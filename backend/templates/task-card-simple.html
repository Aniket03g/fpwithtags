<div x-data="{ open: false }" class="border border-gray-200 rounded-lg bg-white hover:shadow-md transition" id="task-card-{{ .Task.ID }}">
  <div class="p-4 flex items-center justify-between cursor-pointer" @click="open = !open">
    <div class="flex items-center gap-4 flex-1">
      <div class="flex items-center justify-center w-12 h-12 rounded-lg {{ if eq .Task.TaskType "Backend" }}bg-gray-100{{ else if eq .Task.TaskType "UI" }}bg-purple-100{{ else if eq .Task.TaskType "DB" }}bg-blue-100{{ else if eq .Task.TaskType "Dev" }}bg-green-100{{ else }}bg-gray-100{{ end }}">
        <span class="text-sm font-semibold {{ if eq .Task.TaskType "Backend" }}text-gray-700{{ else if eq .Task.TaskType "UI" }}text-purple-700{{ else if eq .Task.TaskType "DB" }}text-blue-700{{ else if eq .Task.TaskType "Dev" }}text-green-700{{ else }}text-gray-700{{ end }}">{{ .Task.TaskType }}</span>
      </div>
      <div class="flex-1">
        <h4 class="font-semibold text-gray-900 text-base">
          {{ .Task.TaskName }}
        </h4>
        <p class="text-gray-600 text-sm mt-1">{{ .Task.Description }}</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <!-- Show Guidance Button -->
      <button 
        @click.stop
        hx-get="/web/tasks/{{ .Task.ID }}/guidance?stack={{ .ProjectTechStack }}"
        hx-target="#guidance-{{ .Task.ID }}"
        hx-swap="innerHTML"
        aria-label="Show Guidance"
        title="Show Guidance"
        class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
        </svg>
      </button>
      <!-- Delete Button -->
      <button 
        @click.stop
        aria-label="Delete Task"
        title="Delete Task"
        class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 transition"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>
      <!-- Expand/Collapse Button -->
      <button type="button" @click.stop="open = !open" aria-label="Toggle Details" class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition">
        <svg :class="{'rotate-180': open, 'rotate-0': !open}" class="h-5 w-5 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>
  </div>
  
  <!-- Guidance Container -->
  <div id="guidance-{{ .Task.ID }}" class="guidance-container"></div>
  
  <!-- Expanded Content -->
  <div x-show="open" x-transition class="border-t border-gray-200 bg-gray-50">
    <div class="p-6">
      <!-- Pull Requests Section -->
      <section class="mb-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-base font-semibold text-gray-900">Pull Requests</h3>
          <button 
            id="add-pr-btn-{{.Task.ID}}"
            class="flex items-center text-sm px-3 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
            hx-get="/tasks/{{.Task.ID}}/pr-form"
            hx-target="#pr-modal-{{.Task.ID}}"
            hx-swap="innerHTML"
            hx-trigger="click">
            <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
            Add Pull Request
          </button>
        </div>
        
        {{ if .Task.PullRequests }}
          <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Title</th>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                {{ range .Task.PullRequests }}
                  <tr class="hover:bg-gray-50">
                    <td class="px-4 py-3 text-sm text-gray-900">{{ .Title }}</td>
                    <td class="px-4 py-3 text-sm">
                      <span class="px-2 py-1 text-xs font-medium rounded-full {{ if eq .Status "merged" }}bg-purple-100 text-purple-800{{ else if eq .Status "open" }}bg-green-100 text-green-800{{ else }}bg-gray-100 text-gray-800{{ end }}">
                        {{ .Status }}
                      </span>
                    </td>
                    <td class="px-4 py-3 text-sm">
                      <a href="{{ .URL }}" target="_blank" class="text-blue-600 hover:text-blue-800">View</a>
                    </td>
                  </tr>
                {{ end }}
              </tbody>
            </table>
          </div>
        {{ else }}
          <div class="text-center py-8 bg-white rounded-lg border border-gray-200">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <p class="mt-2 text-sm text-gray-500">No pull requests yet</p>
          </div>
        {{ end }}
        <div id="pr-modal-{{.Task.ID}}"></div>
      </section>
    </div>
  </div>
</div>
