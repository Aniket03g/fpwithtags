{{ $f := .Feature }}
<div id="feature-card-{{ $f.ID }}"
  class="bg-white rounded-xl shadow-lg border border-gray-200 p-6 mb-4 flex flex-col justify-between transition-transform hover:-translate-y-1 hover:shadow-xl group cursor-pointer"
  role="region" tabindex="0"
  style="position:relative;"
>
  <div>
    {{/* Old inline edit logic commented out
    if eq $.EditingID $f.ID
      {{ template "feature-edit-form.html" (dict "Feature" $f "ProjectID" $.ProjectID) }}
    else */}}
      <h3 class="text-lg font-semibold text-gray-900 mb-2 group-hover:text-primary-700">{{ $f.Title }}</h3>
      <p class="text-gray-500 text-sm mb-4">{{ $f.Description }}</p>
    {{/* end */}}
  </div>
  <div class="flex justify-end gap-2">
    <button 
      hx-get="/web/features/{{ $f.ID }}/edit-inline?project_id={{ $.ProjectID }}"
      hx-target="#feature-card-{{ $f.ID }}"
      hx-swap="outerHTML"
      aria-label="Edit Feature"
      class="inline-flex items-center px-2 py-1 bg-transparent text-gray-500 hover:text-primary-700"
      onclick="event.stopPropagation();"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536M9 13h3l8-8a2.828 2.828 0 00-4-4l-8 8v3h3z" /></svg>
    </button>
  </div>
</div>
