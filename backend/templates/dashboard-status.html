{{ if .LoggedIn }}
  <div class="text-2xl font-semibold text-green-700 mb-4">You are logged in.</div>
{{ else }}
  <div class="text-2xl font-semibold text-red-700 mb-4">You are not logged in.</div>
{{ end }}
<button class="px-6 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition" id="login-btn">Login</button>
