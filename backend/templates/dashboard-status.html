<div id="dashboard-status-content" class="space-y-6">
  <div class="flex items-center justify-between">
    <div id="status-message" class="text-2xl font-semibold"></div>
    <button id="login-logout-btn" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition"></button>
  </div>
  
  {{ if .CurrentUser }}
    {{ if .CurrentUser.IsManager }}
      <!-- Manager-specific dashboard content -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
        <!-- PRs pending approval -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
          <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
            PRs Pending Approval
          </h2>
          <div hx-get="/web/fragments/prs/pending-approval" hx-trigger="load" class="animate-pulse">
            <div class="h-6 bg-gray-200 rounded w-3/4 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-1/2 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-2/3"></div>
          </div>
        </div>
        
        <!-- Release status -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
          <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
            </svg>
            Release Status
          </h2>
          <div hx-get="/web/fragments/releases/status" hx-trigger="load" class="animate-pulse">
            <div class="h-6 bg-gray-200 rounded w-3/4 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-1/2 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-2/3"></div>
          </div>
        </div>
        
        <!-- Team overview -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
          <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            Team Overview
          </h2>
          <div hx-get="/web/fragments/team/overview" hx-trigger="load" class="animate-pulse">
            <div class="h-6 bg-gray-200 rounded w-3/4 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-1/2 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-2/3"></div>
          </div>
        </div>
      </div>
    {{ else }}
      <!-- Developer-specific dashboard content -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
        <!-- My assigned tasks -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
          <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
            My Assigned Tasks
          </h2>
          <div hx-get="/web/fragments/tasks/assigned" hx-trigger="load" class="animate-pulse">
            <div class="h-6 bg-gray-200 rounded w-3/4 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-1/2 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-2/3"></div>
          </div>
        </div>
        
        <!-- My PRs -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
          <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
            My Pull Requests
          </h2>
          <div hx-get="/web/fragments/prs/my-prs" hx-trigger="load" class="animate-pulse">
            <div class="h-6 bg-gray-200 rounded w-3/4 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-1/2 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-2/3"></div>
          </div>
        </div>
        
        <!-- Feature progress -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
          <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
            Feature Progress
          </h2>
          <div hx-get="/web/fragments/features/progress" hx-trigger="load" class="animate-pulse">
            <div class="h-6 bg-gray-200 rounded w-3/4 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-1/2 mb-2"></div>
            <div class="h-6 bg-gray-200 rounded w-2/3"></div>
          </div>
        </div>
      </div>
    {{ end }}
  {{ end }}
</div>
<script>
  // Note: The global HTMX request hook is now handled in login.html
  // This script only handles the dashboard status UI

  function showLoggedIn(username) {
    document.getElementById('status-message').textContent = 'You are logged in as ' + username + '.';
    const btn = document.getElementById('login-logout-btn');
    btn.textContent = 'Logout';
    btn.onclick = function() {
      // Use Auth utility for logout
      Auth.logout();
    };
  }
  
  function showLoggedOut() {
    document.getElementById('status-message').textContent = 'You are not logged in.';
    const btn = document.getElementById('login-logout-btn');
    btn.textContent = 'Login';
    btn.onclick = function() {
      window.location.href = '/web/login';
    };
  }
  
  // On load, check token and update UI
  (function() {
    const token = Auth.getToken();
    if (token) {
      fetch('/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(res => res.ok ? res.json() : null)
      .then(data => {
        if (data && data.username) {
          showLoggedIn(data.username);
        } else {
          showLoggedOut();
        }
      })
      .catch(() => showLoggedOut());
    } else {
      showLoggedOut();
    }
  })();
</script>
