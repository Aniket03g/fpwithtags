<div id="main-content" class="min-h-screen bg-gray-50 p-8">
  <div id="feature-detail-container" class="max-w-5xl mx-auto">
    <div class="flex items-center gap-4 mb-6">
      <a hx-get="/web/projects/{{ .Feature.ProjectID }}/features"
         hx-target="#main-content"
         hx-select="#main-content > *"
         hx-push-url="true"
         class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white hover:bg-gray-100 transition shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
      </a>
      <h2 class="text-2xl font-bold text-gray-900">{{ .Feature.Title }}</h2>
    </div>

    <!-- Description Section -->
    <div class="bg-white rounded-lg shadow-sm p-8 mb-6">
      <h3 class="text-xl font-semibold text-gray-900 mb-4">Description</h3>
      <p class="text-gray-600 mb-6">{{ .Feature.Description }}</p>
      <div class="flex flex-wrap gap-4">
        <div>
          <div class="text-xs font-medium text-gray-500 mb-2">Category</div>
          <span class="inline-block px-3 py-1 rounded-md bg-blue-100 text-blue-700 text-sm font-medium">{{ .Feature.Category }}</span>
        </div>
        <div>
          <div class="text-xs font-medium text-gray-500 mb-2">Status</div>
          <span class="inline-block px-3 py-1 rounded-md bg-yellow-100 text-yellow-700 text-sm font-medium">{{ .Feature.Status }}</span>
        </div>
        <div>
          <div class="text-xs font-medium text-gray-500 mb-2">Priority</div>
          <span class="inline-block px-3 py-1 rounded-md bg-orange-100 text-orange-700 text-sm font-medium">{{ .Feature.Priority }}</span>
        </div>
      </div>
    </div>

    <!-- Dependencies Section -->
    <div class="bg-white rounded-lg shadow-sm p-8 mb-6">
      <h3 class="text-xl font-semibold text-gray-900 mb-4">Dependencies</h3>
      <div 
        id="dependency-section" 
        hx-get="/web/fragments/dependencies/panels?entity_type=feature&entity_id={{ .Feature.ID }}" 
        hx-trigger="load"
        hx-swap="innerHTML">
          <div class="text-center py-8">
            <svg class="mx-auto animate-spin h-8 w-8 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>
            <p class="text-gray-400 mt-2">Loading dependencies...</p>
          </div>
      </div>
    </div>

    <!-- Attachments Section -->
    <div class="bg-white rounded-lg shadow-sm p-8 mb-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-semibold text-gray-900">Attachments</h3>
        <div class="flex gap-2">
          <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition">
            Choose File
          </button>
          <button class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition">
            Add File
          </button>
        </div>
      </div>
      <p class="text-gray-500 text-sm">No attachments yet.</p>
    </div>

    <!-- Tasks Section -->
    <div 
      id="task-section" 
      hx-get="/web/features/{{ .Feature.ID }}/tasks" 
      hx-trigger="load"
      hx-swap="innerHTML">
        <div class="text-center py-8">
          <svg class="mx-auto animate-spin h-8 w-8 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>
          <p class="text-gray-400 mt-2">Loading tasks...</p>
        </div>
    </div>

    <!-- Linked Code Section -->
    <div 
      id="linked-code-section" 
      hx-get="/web/features/{{ .Feature.ID }}/linked-code" 
      hx-trigger="load"
      hx-swap="innerHTML">
        <div class="text-center py-8">
          <svg class="mx-auto animate-spin h-8 w-8 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>
          <p class="text-gray-400 mt-2">Loading linked code...</p>
        </div>
    </div>
  </div>
</div>

<!-- Modal container for HTMX to target -->
<div id="modal"></div>
