<div id="main-content">
<div id="feature-detail-container" class="p-6">
  
  <div class="flex items-center gap-4 mb-6">
    <a hx-get="/web/projects/{{ .Feature.ProjectID }}/features"
       hx-target="#main-content"
       hx-select="#main-content > *"
       hx-push-url="true"
       class="btn btn-square btn-ghost">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
    </a>
    <h2 class="text-2xl font-bold text-base-content">{{ .Feature.Title }}</h2>
  </div>

  <div class="card bg-base-100 shadow-xl mb-8">
    <div class="card-body">
      <h3 class="card-title">Description</h3>
      <p class="text-base-content/80">{{ .Feature.Description }}</p>
      <div class="mt-4 flex gap-4">
        <div>
          <div class="font-semibold text-sm">Category</div>
          <div class="badge badge-neutral">{{ .Feature.Category }}</div>
        </div>
        <div>
          <div class="font-semibold text-sm">Status</div>
          <div class="badge badge-secondary">{{ .Feature.Status }}</div>
        </div>
        <div>
          <div class="font-semibold text-sm">Priority</div>
          <div class="badge badge-accent">{{ .Feature.Priority }}</div>
        </div>
      </div>
    </div>
  </div>

  <div 
    id="task-section" 
    hx-get="/web/features/{{ .Feature.ID }}/tasks" 
    hx-trigger="load"
    hx-swap="innerHTML">
      <div class="text-center">
        <span class="loading loading-spinner loading-lg"></span>
        <p>Loading tasks...</p>
      </div>
  </div>

</div>
