<div class="card bg-base-100 shadow-md border border-base-300 group mb-4 w-full">
  <div class="card-body p-6 flex-row items-center justify-between w-full">
    <div class="flex items-center gap-4 w-full">
      <div class="badge badge-primary font-semibold text-base">{{ .Task.TaskType }}</div>
      <div class="flex-1">
        <h4 class="font-bold text-base-content text-lg">{{ .Task.TaskName }}</h4>
        <p class="text-base-content/70 mt-1">{{ .Task.Description }}</p>
      </div>
      <div class="card-actions flex-shrink-0 ml-2">
        <button 
          class="btn btn-square btn-ghost btn-sm opacity-0 group-hover:opacity-100 transition"
          hx-get="/web/fragments/features/{{ .FeatureID }}/tasks/{{ .Task.ID }}/edit"
          hx-target="closest .card"
          hx-swap="outerHTML"
          aria-label="Edit Task"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L14.5 6.5z" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
