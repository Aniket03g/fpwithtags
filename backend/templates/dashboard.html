<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeaturePlus Dashboard</title>
  <!-- Tailwind CSS (standalone for CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="flex min-h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside>
    <ul class="flex flex-col gap-2 p-4 w-72 min-h-full bg-white border-r border-gray-200 text-gray-800 shadow-lg">
      <li class="text-lg font-bold tracking-wide mb-4">FeaturePlus</li>
      <li>
        <a href="/web/projects">Projects</a>
      </li>
      {{ range .Projects }}
        <li><a href="/web/projects/{{ .ID }}">{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </aside>
  <!-- Main Area Wrapper -->
  <div class="flex-1 flex flex-col">
    <!-- Top Navbar -->
    <header>
      <div class="flex items-center justify-between h-16 px-6 bg-white border-b border-gray-200 shadow-sm">
        <div class="flex-1"></div>
        <div class="flex-none">
          <div class="form-control">
            <input type="text" placeholder="Search..." class="block w-full max-w-xs px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm" />
          </div>
        </div>
        <div class="flex-none ml-4">
          <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" @blur="open = false" class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-primary-500 cursor-pointer">
              <span class="sr-only">Open user menu</span>
              <div class="w-10 rounded-full">
                <img src="https://i.pravatar.cc/100?img=3" alt="User avatar" />
              </div>
            </button>
            <ul x-show="open" @click.away="open = false" class="absolute right-0 mt-2 w-52 bg-white border border-gray-200 rounded-lg shadow-lg py-2 z-50" x-transition>
              <li><a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Profile</a></li>
              <li><a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 p-6" hx-get="{{ .InitialURL }}" hx-trigger="load"></main>
  </div>
</body>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var main = document.getElementById('main-content');
  if (main && main.childElementCount === 0 && main.getAttribute('hx-get')) {
    htmx.process(main); // triggers hx-get if not already loaded
  }
});
</script>
</html>
