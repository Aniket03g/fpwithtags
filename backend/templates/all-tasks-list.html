<div class="p-6">
  <!-- Header with flexbox to align title and button -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold text-gray-800">All Tasks</h2>
  </div>
  
  <div class="overflow-x-auto">
    <table class="min-w-full bg-white rounded-lg overflow-hidden shadow-md">
      <thead class="bg-gray-100 text-gray-700">
        <tr>
          <th class="py-3 px-4 text-left font-medium">Title</th>
          <th class="py-3 px-4 text-left font-medium">Type</th>
          <th class="py-3 px-4 text-left font-medium">Status</th>
          <th class="py-3 px-4 text-left font-medium">Feature</th>
          <th class="py-3 px-4 text-left font-medium">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        {{ if .Tasks }}
          {{ range .Tasks }}
            <tr class="hover:bg-gray-50">
              <td class="py-3 px-4">{{ .Title }}</td>
              <td class="py-3 px-4">
                <span class="px-2 py-1 text-xs font-semibold rounded-full 
                  {{ if eq .TaskType "UI" }}bg-purple-100 text-purple-800
                  {{ else if eq .TaskType "DB" }}bg-blue-100 text-blue-800
                  {{ else if eq .TaskType "Dev" }}bg-green-100 text-green-800
                  {{ else }}bg-gray-100 text-gray-800{{ end }}">
                  {{ .TaskType }}
                </span>
              </td>
              <td class="py-3 px-4">
                <span class="px-2 py-1 text-xs font-semibold rounded-full 
                  {{ if eq .Status "todo" }}bg-red-100 text-red-800
                  {{ else if eq .Status "in_progress" }}bg-yellow-100 text-yellow-800
                  {{ else if eq .Status "done" }}bg-green-100 text-green-800
                  {{ else }}bg-gray-100 text-gray-800{{ end }}">
                  {{ .Status }}
                </span>
              </td>
              <td class="py-3 px-4">{{ .FeatureTitle }}</td>
              <td class="py-3 px-4">
                <a href="/web/features/{{ .FeatureID }}/tasks/{{ .ID }}/view" 
                   class="text-blue-600 hover:text-blue-800 mr-2"
                   hx-get="/web/features/{{ .FeatureID }}/tasks/{{ .ID }}/view" 
                   hx-target="#main-content" 
                   hx-push-url="true">
                  View
                </a>
              </td>
            </tr>
          {{ end }}
        {{ else }}
          <tr>
            <td colspan="5" class="py-4 px-4 text-center text-gray-500">No tasks found.</td>
          </tr>
        {{ end }}
      </tbody>
    </table>
  </div>
</div>
