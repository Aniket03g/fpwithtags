<!-- Inline Feature Creation Form for Release -->
<div class="bg-white border-2 border-green-200 rounded-lg p-6 mb-4 shadow-sm" id="new-feature-form">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-lg font-semibold text-gray-800">Create New Feature for This Release</h3>
    <button 
      class="text-gray-500 hover:text-gray-700"
      onclick="this.closest('#new-feature-form').remove()">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  
  <form 
    hx-post="/api/releases/{{ .ReleaseID }}/features/create"
    hx-target="#planned-features-list"
    hx-swap="outerHTML"
    class="space-y-4">
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Feature Title *</label>
      <input 
        type="text" 
        name="title" 
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
        placeholder="e.g., User Authentication System">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea 
        name="description" 
        rows="3"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
        placeholder="Describe what this feature will do..."></textarea>
    </div>
    
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <select 
          name="category"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500">
          <option value="general">General</option>
          <option value="frontend">Frontend</option>
          <option value="backend">Backend</option>
          <option value="infrastructure">Infrastructure</option>
          <option value="security">Security</option>
          <option value="performance">Performance</option>
        </select>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
        <select 
          name="priority"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Tags</label>
      <div x-data="tagInput()" class="relative">
        <input
          type="text"
          x-model="input"
          @input="onInput"
          @keydown="onKeydown"
          @keydown.enter.prevent="addTag()"
          placeholder="Enter tags separated by space, comma, or semicolon"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm"
        />
        <div x-show="showDropdown" class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded shadow-lg max-h-40 overflow-auto" @mousedown.away="showDropdown=false">
          <template x-for="suggestion in suggestions" :key="suggestion">
            <div @click="selectSuggestion(suggestion)" class="px-3 py-2 cursor-pointer hover:bg-green-100 text-gray-800" x-text="suggestion"></div>
          </template>
        </div>
        <div class="flex flex-wrap mt-2 gap-2">
          <template x-for="(tag, idx) in tags" :key="tag">
            <span class="bg-gray-200 px-3 py-1 rounded-full flex items-center text-sm">
              <span x-text="tag"></span>
              <button type="button" class="ml-2 text-gray-500 hover:text-red-600" @click="removeTag(idx)">×</button>
            </span>
          </template>
        </div>
        <input type="hidden" name="tags_input" :value="tags.join(' ')" />
      </div>
    </div>
    
    <div class="flex justify-end gap-2 pt-2">
      <button 
        type="button"
        class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition"
        onclick="this.closest('#new-feature-form').remove()">
        Cancel
      </button>
      <button 
        type="submit"
        class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-medium">
        Create Feature
      </button>
    </div>
  </form>
</div>

<script>
function tagInput() {
  return {
    input: '',
    tags: [],
    showDropdown: false,
    suggestions: [],
    allTags: [], // Will be populated from server if needed
    addTag() {
      let value = this.input.trim().replace(/[,;]$/, '');
      if (value) {
        value.split(/[,;\s]+/).forEach(tag => {
          tag = tag.trim();
          if (tag && !this.tags.includes(tag)) this.tags.push(tag);
        });
      }
      this.input = '';
      this.showDropdown = false;
    },
    removeTag(idx) {
      this.tags.splice(idx, 1);
    },
    onInput() {
      this.showDropdown = true;
      this.suggestions = this.getSuggestions(this.input);
    },
    onKeydown(e) {
      if (e.key === 'Enter') {
        this.addTag();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        this.selectNextSuggestion();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        this.selectPreviousSuggestion();
      }
    },
    getSuggestions(input) {
      const lowerCaseInput = input.toLowerCase();
      return this.allTags.filter(tag => tag.toLowerCase().startsWith(lowerCaseInput));
    },
    selectSuggestion(suggestion) {
      this.input = suggestion;
      this.addTag();
      this.showDropdown = false;
    },
    selectNextSuggestion() {
      if (this.suggestions.length > 0) {
        const currentIndex = this.suggestions.indexOf(this.input);
        const nextIndex = (currentIndex + 1) % this.suggestions.length;
        this.input = this.suggestions[nextIndex];
      }
    },
    selectPreviousSuggestion() {
      if (this.suggestions.length > 0) {
        const currentIndex = this.suggestions.indexOf(this.input);
        const prevIndex = (currentIndex - 1 + this.suggestions.length) % this.suggestions.length;
        this.input = this.suggestions[prevIndex];
      }
    }
  }
}
</script>
