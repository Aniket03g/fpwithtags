{{ if not .Features }}
  <div class="flex flex-col items-center justify-center py-16">
    <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
    <p class="text-gray-500 text-lg mb-2">No features found</p>
    <p class="text-gray-400 text-sm">Start by adding a new feature to this project.</p>
  </div>
{{ else }}
  {{ range .Features }}
    {{ template "feature-card.html" (dict "Feature" . "ProjectID" $.ProjectID) }}
  {{ end }}
{{ end }}
