<div id="task-list-container" class="space-y-4 pt-6">
  
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-xl font-semibold text-base-content">Associated Tasks</h3>
    <div class="flex items-center gap-2">
      <a hx-get="/web/features/{{ .Feature.ID }}/tasks?type=All" hx-target="#task-list-container" hx-swap="outerHTML" class="btn btn-sm {{ if or (not .FilterType) (eq .FilterType "All") }}btn-active{{ end }}">All</a>
      <a hx-get="/web/features/{{ .Feature.ID }}/tasks?type=UI" hx-target="#task-list-container" hx-swap="outerHTML" class="btn btn-sm {{ if eq .FilterType "UI" }}btn-active{{ end }}">UI</a>
      <a hx-get="/web/features/{{ .Feature.ID }}/tasks?type=DB" hx-target="#task-list-container" hx-swap="outerHTML" class="btn btn-sm {{ if eq .FilterType "DB" }}btn-active{{ end }}">DB</a>
      <a hx-get="/web/features/{{ .Feature.ID }}/tasks?type=Dev" hx-target="#task-list-container" hx-swap="outerHTML" class="btn btn-sm {{ if eq .FilterType "Dev" }}btn-active{{ end }}">Dev</a>

      <button hx-get="/web/features/{{ .Feature.ID }}/tasks/new" hx-target="#new-task-form-container" hx-swap="innerHTML" class="btn btn-sm btn-primary">Add Task</button>
    </div>
  </div>

  <div id="new-task-form-container"></div>

  {{ if .Tasks }}
    {{ range .Tasks }}
    <div class="card bg-base-100 shadow-md border border-base-300">
      <div class="card-body p-4 flex-row items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="badge badge-primary font-semibold">{{ .TaskType }}</div>
          <div>
            <h4 class="font-bold text-base-content">{{ .TaskName }}</h4>
            <p class="text-sm text-base-content/70">{{ .Description }}</p>
          </div>
        </div>
        <div class="card-actions">
           <button class="btn btn-square btn-ghost btn-sm">
             <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L14.5 6.5z" /></svg>
           </button>
        </div>
      </div>
    </div>
    {{ end }}
  {{ else }}
    <div class="text-center p-8 bg-base-100 rounded-lg shadow-md border border-base-300">
      <p class="text-base-content/70">No '{{ .FilterType }}' tasks found for this feature.</p>
    </div>
  {{ end }}

</div>
