<!-- Dependency Modal - For adding new dependencies -->
<div id="dependency-modal" class="fixed inset-0 z-50 overflow-y-auto" aria-modal="true" role="dialog">
  <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
    <!-- Background overlay -->
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"
         onclick="document.getElementById('dependency-modal').remove()"></div>

    <!-- Modal panel -->
    <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
      <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
        <div class="sm:flex sm:items-start">
          <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Add Dependency</h3>
            <p class="text-sm text-gray-500 mb-4">
              Select a feature that this {{ .EntityType }} depends on.
              This {{ .EntityType }} will be blocked until the dependency is resolved.
            </p>
            
            <form 
              hx-post="/api/dependencies" 
              hx-target="#dependency-section" 
              hx-swap="innerHTML"
              hx-on::after-request="document.getElementById('dependency-modal').remove(); htmx.trigger('#dependency-section', 'refreshDependencies')"
              class="space-y-4">
              
              <!-- Hidden fields for the current entity -->
              <input type="hidden" name="child_type" value="{{ .EntityType }}">
              <input type="hidden" name="child_id" value="{{ .EntityID }}">
              <!-- Always set parent_type to feature -->
              <input type="hidden" name="parent_type" value="feature">
              
              <!-- Feature Search and Selection -->
              <div>
                <label for="feature-search" class="block text-sm font-medium text-gray-700">
                  Select Feature to Depend On
                </label>
                
                <!-- Search input with HTMX -->
                <div class="mt-1 relative">
                  <input 
                    type="text" 
                    id="feature-search" 
                    placeholder="Type to search features..." 
                    class="block w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                    hx-get="/api/features/search"
                    hx-trigger="keyup changed delay:300ms"
                    hx-target="#feature-options"
                    hx-params="query"
                    autocomplete="off">
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                    <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                  </div>
                </div>
                
                <!-- Search results container -->
                <div id="feature-options" class="mt-1 bg-white shadow-lg rounded-md max-h-60 overflow-auto">
                  <!-- Default options (before search) -->
                  <div class="p-2">
                    <select 
                      name="parent_id" 
                      id="feature_id"
                      class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md"
                      required>
                      <option value="">Select Feature</option>
                      {{ range .Features }}
                        {{ if ne (printf "%d" .ID) (printf "%d" $.EntityID) }}
                        <option value="{{ .ID }}">{{ .Title }}</option>
                        {{ end }}
                      {{ end }}
                    </select>
                    <p class="text-xs text-gray-500 mt-1">Search above to filter features or select from this list</p>
                  </div>
                </div>
              </div>
              
              <!-- Description (Optional) -->
              <div>
                <label for="description" class="block text-sm font-medium text-gray-700">
                  Description (Optional)
                </label>
                <textarea 
                  name="description" 
                  id="description"
                  rows="2"
                  class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                  placeholder="Explain why this dependency exists..."></textarea>
              </div>
              
              <!-- Form buttons -->
              <div class="flex justify-end space-x-3 pt-4">
                <button 
                  type="button" 
                  onclick="document.getElementById('dependency-modal').remove()"
                  class="inline-flex justify-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                  Cancel
                </button>
                <button 
                  type="submit" 
                  class="inline-flex justify-center px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                  hx-indicator="#submit-spinner">
                  <span>Add Dependency</span>
                  <span id="submit-spinner" class="htmx-indicator ml-2">
                    <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                    </svg>
                  </span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
      
      <!-- Close button -->
      <div class="absolute top-0 right-0 pt-4 pr-4">
        <button 
          type="button" 
          onclick="document.getElementById('dependency-modal').remove()"
          class="bg-white rounded-md text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          <span class="sr-only">Close</span>
          <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
