<div id="feature-card-{{ .Feature.ID }}" class="bg-white rounded-xl shadow-lg border border-gray-200 p-6 mb-4 flex flex-col justify-between">
  <form 
    method="POST"
    hx-post="/web/fragments/features/{{ .Feature.ID }}/edit-inline?project_id={{ .ProjectID }}"
    hx-target="#feature-card-{{ .Feature.ID }}"
    hx-swap="outerHTML"
    class="flex flex-col gap-4"
  >
    <input 
      type="text"
      name="title"
      value="{{ .Feature.Title }}"
      placeholder="Feature Title"
      class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-base font-semibold text-gray-900"
      required
    />
    <textarea
      name="description"
      placeholder="Feature Description"
      class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm text-gray-700"
      rows="3"
    >{{ .Feature.Description }}</textarea>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Tags</label>
      <div x-data="tagInputEdit({{ .Feature.Tags | toJson }})" class="relative">
        <input
          type="text"
          x-model="input"
          @input="onInput"
          @keydown="onKeydown"
          @keydown.enter.prevent="addTag"
          @keydown.space.prevent="addTag"
          @keydown.,.prevent="addTag"
          @keydown.;.prevent="addTag"
          placeholder="Enter tags separated by space, comma, or semicolon"
          class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm text-gray-700"
        />
        <div x-show="showDropdown" class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded shadow-lg max-h-40 overflow-auto" @mousedown.away="showDropdown=false">
          <template x-for="suggestion in suggestions" :key="suggestion">
            <div @click="selectSuggestion(suggestion)" class="px-3 py-2 cursor-pointer hover:bg-primary-100 text-gray-800" x-text="suggestion"></div>
          </template>
        </div>
        <div class="flex flex-wrap mt-2 gap-2">
          <template x-for="(tag, idx) in tags" :key="tag">
            <span class="bg-gray-200 px-3 py-1 rounded-full flex items-center">
              <span x-text="tag"></span>
              <button type="button" class="ml-2 text-gray-500 hover:text-red-600" @click="removeTag(idx)">×</button>
            </span>
          </template>
        </div>
        <input type="hidden" name="tags_input" :value="tags.join(' ')" />
      </div>
    </div>
    <div class="flex justify-end gap-2">
      <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-lg shadow hover:bg-primary-700 text-sm font-medium">Save</button>
      <button type="button"
        hx-get="/web/fragments/features/{{ .Feature.ID }}/view?project_id={{ .ProjectID }}"
        hx-target="#feature-card-{{ .Feature.ID }}"
        hx-swap="outerHTML"
        class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg shadow hover:bg-gray-300 text-sm font-medium"
      >Cancel</button>
    </div>
  </form>
</div>
