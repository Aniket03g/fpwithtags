<div id="feature-card-{{ .Feature.ID }}" class="bg-white rounded-xl shadow-lg border border-gray-200 p-6 mb-4 flex flex-col justify-between">
  <form 
    method="POST"
    hx-post="/web/fragments/features/{{ .Feature.ID }}/edit-inline?project_id={{ .ProjectID }}"
    hx-target="#feature-card-{{ .Feature.ID }}"
    hx-swap="outerHTML"
    class="flex flex-col gap-4"
  >
    <input 
      type="text"
      name="title"
      value="{{ .Feature.Title }}"
      placeholder="Feature Title"
      class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-base font-semibold text-gray-900"
      required
    />
    <textarea
      name="description"
      placeholder="Feature Description"
      class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm text-sm text-gray-700"
      rows="3"
    >{{ .Feature.Description }}</textarea>
    <div class="flex justify-end gap-2">
      <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-lg shadow hover:bg-primary-700 text-sm font-medium">Save</button>
      <button type="button"
        hx-get="/web/fragments/features/{{ .Feature.ID }}/view?project_id={{ .ProjectID }}"
        hx-target="#feature-card-{{ .Feature.ID }}"
        hx-swap="outerHTML"
        class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg shadow hover:bg-gray-300 text-sm font-medium"
      >Cancel</button>
    </div>
  </form>
</div>
