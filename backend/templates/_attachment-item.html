{{define "attachment-item"}}
<div class="attachment-item bg-white rounded border border-gray-200 p-2 flex items-center justify-between">
    <div class="flex items-center space-x-2">
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
        </svg>
        <div>
            <a href="/api/tasks/{{.TaskID}}/attachments/{{.Filename}}" 
               class="text-xs text-blue-600 hover:text-blue-800 font-medium"
               target="_blank">
                {{.Filename}}
            </a>
            <div class="text-xs text-gray-400">
                {{.FileSize}} bytes • {{.CreatedAt.Format "Jan 2, 3:04 PM"}}
            </div>
        </div>
    </div>
    <button 
        hx-delete="/api/tasks/{{.TaskID}}/attachments/{{.ID}}"
        hx-target="closest .attachment-item"
        hx-swap="outerHTML"
        hx-confirm="Are you sure you want to delete this attachment?"
        class="text-red-600 hover:text-red-800 text-xs font-medium">
        Delete
    </button>
</div>
{{end}}
