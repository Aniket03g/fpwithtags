{{define "project-form"}}
<div class="relative rounded-lg bg-white shadow-xl">
    <!-- Header -->
    <div class="flex items-center justify-between rounded-t-lg border-b border-slate-200 bg-slate-50 p-4">
        <h3 class="text-lg font-semibold text-slate-800">Create New Project</h3>
        <button type="button" class="text-slate-400 hover:text-slate-600"
            onclick="document.getElementById('modal').classList.add('hidden')">
            <span class="sr-only">Close</span>
            <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- Form -->
    <form hx-post="/web/projects" hx-target="#project-list" hx-swap="afterbegin"
        hx-on="htmx:afterRequest: document.getElementById('modal').classList.add('hidden')">
        <div class="p-6">
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Project Name</label>
                <input type="text" name="name" id="name" required
                    class="block w-full rounded-md border-slate-300 shadow-sm focus:border-sky-500 focus:ring-sky-500 sm:text-sm">
            </div>
            <div class="mb-4">
                <label for="description" class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                <textarea name="description" id="description" rows="4"
                    class="block w-full rounded-md border-slate-300 shadow-sm focus:border-sky-500 focus:ring-sky-500 sm:text-sm"></textarea>
            </div>
        </div>

        <!-- Footer -->
        <div class="flex justify-end gap-x-3 rounded-b-lg border-t border-slate-200 bg-slate-50 p-4">
            <button type="button"
                class="rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2"
                onclick="document.getElementById('modal').classList.add('hidden')">
                Cancel
            </button>
            <button type="submit"
                class="rounded-md border border-transparent bg-sky-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2">
                Create Project
            </button>
        </div>
    </form>
</div>
{{end}}
