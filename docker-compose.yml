version: '3.8'

services:
  featureplus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.docker  # Use Docker-specific environment variables
    volumes:
      # Mount host data directory instead of using a volume
      - ./backend/data:/app/data
    restart: unless-stopped
