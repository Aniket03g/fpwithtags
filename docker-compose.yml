version: '3.8'

services:
  featureplus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.docker  # Use Docker-specific environment variables
    volumes:
      - featureplus_data:/app/data    # Persistent volume for data
    restart: unless-stopped

volumes:
  featureplus_data:  # Named volume for persistent data storage
